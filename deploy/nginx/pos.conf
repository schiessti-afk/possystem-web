# Public edge for the POS dashboard on a host where nginx already serves
# other sites. Pairs with docker-compose.override.prod.yml, which binds the
# app to 127.0.0.1:3010 and the sync API to 127.0.0.1:8010.
#
# Install:
#   sudo cp deploy/nginx/pos.conf /etc/nginx/sites-available/pos.conf
#   sudo ln -s /etc/nginx/sites-available/pos.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d mypos.duckdns.org
#
# certbot rewrites this file to add the :443 server block and the http->https
# redirect, so only the plain :80 block is checked in here.
# Edge damping for password guessing, on top of the backend's own per-address
# limit. Sized for a human owner signing in, not for a script. This directive
# sits in the http context — sites-enabled is included from inside it.
limit_req_zone $binary_remote_addr zone=pos_login:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name mypos.duckdns.org;

    # Register batches can be larger than nginx's 1m default.
    client_max_body_size 10m;

    # The dashboard is never meant to be framed; mirrors the Caddyfile.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header Referrer-Policy "same-origin" always;

    # Registers push their event log here. This is the only backend surface
    # that has to be public, and it is guarded by API_BEARER_TOKEN.
    location /api/v1/sync/ {
        proxy_pass http://127.0.0.1:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The sign-in page, rate limited. burst absorbs the handful of requests
    # one real page load makes; nodelay serves them immediately rather than
    # queueing. Exceeding it returns 503 from nginx before Next.js is touched.
    location = /login {
        limit_req zone=pos_login burst=10 nodelay;

        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else is the Next.js dashboard. Host and X-Forwarded-Proto
    # matter here: middleware.ts builds its /login redirect from request.url,
    # and the session cookie is Secure-only in production.
    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
