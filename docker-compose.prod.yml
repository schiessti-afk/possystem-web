# Production stack for a single VPS: Postgres + FastAPI + Next.js behind
# Caddy, which terminates HTTPS on a (free) DuckDNS hostname.
#
#   cp .env.prod.example .env.prod   # then fill in real secrets
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#
# Only Caddy publishes ports. Postgres and the backend are reachable solely
# over the internal compose network, so the dashboard API key and the DB
# password never leave the host.
services:
  db:
    image: postgres:16-alpine
    container_name: pos_prod_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Applied automatically on FIRST volume initialization only.
      - ./vps_backend/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12

  backend:
    build: ./vps_backend
    container_name: pos_prod_api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      # Must match the token configured on every register.
      API_BEARER_TOKEN: ${API_BEARER_TOKEN}
      DASHBOARD_API_KEY: ${DASHBOARD_API_KEY}
      # Browsers never call the backend directly (all reads are server-side),
      # so no cross-origin access is needed.
      DASHBOARD_ALLOWED_ORIGINS: "https://${SITE_DOMAIN}"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: pos_prod_web
    restart: unless-stopped
    environment:
      # Internal service name: this hop never leaves the Docker network.
      # No API key here — the UI authenticates as the signed-in admin, using
      # the session token from their login cookie.
      BACKEND_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    container_name: pos_prod_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates survive restarts; without this Let's Encrypt is
      # re-hit on every deploy and will eventually rate-limit you.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

  # Keeps the DuckDNS record pointed at this host. Harmless on a static IP,
  # essential if the VPS address ever changes.
  duckdns:
    image: lscr.io/linuxserver/duckdns:latest
    container_name: pos_prod_duckdns
    restart: unless-stopped
    environment:
      SUBDOMAINS: ${DUCKDNS_SUBDOMAIN}
      TOKEN: ${DUCKDNS_TOKEN}
      TZ: ${TZ:-UTC}

volumes:
  pgdata:
  caddy_data:
  caddy_config:
